<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OAK service</title>
  <style>
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --border: #e3e6ea; --text: #1c2024;
      --muted: #6b7280; --accent: #2f6feb; --chip: #eef1f5;
      --ok: #1a7f37; --ok-bg: #e6f4ea; --warn: #9a6700; --warn-bg: #fff5db;
      --idle: #6b7280; --idle-bg: #eceef1; --err: #b42318; --err-bg: #fdecea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a; --panel: #1c1f24; --border: #2b2f36; --text: #e6e8eb;
        --muted: #9aa3ad; --accent: #6ea8fe; --chip: #262a31;
        --ok: #4ac26b; --ok-bg: #123321; --warn: #e3b341; --warn-bg: #33280a;
        --idle: #9aa3ad; --idle-bg: #262a31; --err: #ff7b72; --err-bg: #3a1a17;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    h1 { font-size: 20px; margin: 0; font-weight: 650; }
    h1 small { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 6px; }
    .sub { color: var(--muted); font-size: 13px; margin: 2px 0 20px; }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
      font-size: 13px; font-weight: 600; }
    .badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .b-ok { color: var(--ok); background: var(--ok-bg); }
    .b-warn { color: var(--warn); background: var(--warn-bg); }
    .b-idle { color: var(--idle); background: var(--idle-bg); }
    .b-err { color: var(--err); background: var(--err-bg); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 20px; }
    .card.pl { margin-bottom: 0; }
    .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
    .plhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .plhead .nm { font-weight: 650; font-size: 15px; }
    .kv { display: grid; grid-template-columns: minmax(100px, auto) 1fr; gap: 6px 14px; font-size: 14px; align-items: center; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; word-break: break-word; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { background: var(--chip); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px;
      font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .yes { color: var(--ok); font-weight: 600; } .no { color: var(--muted); }
    .banner { background: var(--err-bg); color: var(--err); border-radius: 8px; padding: 8px 12px; margin-top: 10px; font-size: 13px; }
    input { padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); width: 100%; }
    button { padding: 7px 16px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
    th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    tr:last-child td { border-bottom: none; }
    .st { font-weight: 600; font-size: 12px; padding: 2px 8px; border-radius: 6px; }
    .st-SUCCESS { color: var(--ok); background: var(--ok-bg); }
    .st-FAILED { color: var(--err); background: var(--err-bg); }
    .empty { color: var(--muted); padding: 20px; text-align: center; font-size: 14px; }
    .foot { color: var(--muted); font-size: 12px; margin-top: 16px; text-align: right; }
    h2.section { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>OAK service <small id="svc"></small></h1>
      <span id="foot" class="foot" style="margin:0"></span>
    </header>
    <div class="sub" id="sub">Connecting to the executor…</div>

    <h2 class="section">Platforms</h2>
    <div class="grid" id="platforms"></div>

    <div class="card">
      <h2>Connect a platform</h2>
      <div class="kv">
        <label for="inName">Platform</label><input id="inName" placeholder="oppex">
        <label for="inBaseUrl">Base URL</label><input id="inBaseUrl" class="mono" placeholder="http://localhost:8975">
        <label for="inClientId">Client ID</label><input id="inClientId" class="mono" placeholder="from the platform's OAK Connection page">
        <label for="inApiKey">API key</label><input id="inApiKey" type="password" placeholder="optional dev bootstrap — blank to pair">
        <span></span><span><button id="saveBtn">Save &amp; connect</button></span>
      </div>
      <div id="saveMsg" class="sub" style="margin:12px 0 0"></div>
    </div>

    <div class="card">
      <h2>Advertised capabilities (<span id="capCount">0</span>)</h2>
      <div class="chips" id="caps"><span class="empty">none</span></div>
    </div>

    <h2 class="section">Recent steps</h2>
    <table>
      <thead><tr><th>Time</th><th>Platform</th><th>Workflow / Task</th><th>Capability</th><th>Status</th><th>Note</th></tr></thead>
      <tbody id="recent"><tr><td colspan="6" class="empty">No steps yet.</td></tr></tbody>
    </table>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const fmt = (iso) => { if (!iso) return "—"; const d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleString(); };

    const PHASE = {
      CONNECTED: ["b-ok", "connected"], PENDING_APPROVAL: ["b-warn", "waiting for approval"],
      PAIRING: ["b-warn", "pairing"], DISCONNECTED: ["b-err", "disconnected"],
      ERROR: ["b-err", "error"], IDLE: ["b-idle", "idle"]
    };

    function platformCard(p) {
      const [cls, label] = PHASE[p.phase] || ["b-idle", p.phase.toLowerCase()];
      return `<div class="card pl">
        <div class="plhead"><span class="nm">${esc(p.name)}</span><span class="badge ${cls}">${esc(label)}</span></div>
        <dl class="kv">
          <dt>Base URL</dt><dd class="mono">${esc(p.baseUrl || "not set")}</dd>
          <dt>Client ID</dt><dd class="mono">${esc(p.clientIdMasked || "—")}</dd>
          <dt>Token</dt><dd>${p.tokenPresent ? '<span class="yes">present</span>' : '<span class="no">none</span>'}</dd>
          ${p.connectionId ? `<dt>Connection</dt><dd class="mono">${esc(p.connectionId)}</dd>` : ""}
          <dt>Since</dt><dd>${fmt(p.since)}</dd>
        </dl>
        ${p.detail ? `<div class="sub" style="margin:10px 0 0">${esc(p.detail)}</div>` : ""}
        ${p.lastError ? `<div class="banner">⚠ ${esc(p.lastError)}</div>` : ""}
      </div>`;
    }

    function render(d) {
      $("svc").textContent = d.serviceVersion ? "v" + d.serviceVersion : "";
      const platforms = d.platforms || [];
      const connected = platforms.filter(p => p.phase === "CONNECTED").length;
      $("sub").textContent = platforms.length
        ? `${connected} of ${platforms.length} platform(s) connected · ${d.serviceName} · polling ${d.pollInterval}`
        : "No platforms configured yet — add one below.";
      $("platforms").innerHTML = platforms.length
        ? platforms.map(platformCard).join("")
        : '<div class="card pl"><span class="empty">none configured</span></div>';

      const caps = d.advertised || [];
      $("capCount").textContent = caps.length;
      $("caps").innerHTML = caps.length ? caps.map(c => `<span class="chip">${esc(c)}</span>`).join("")
        : '<span class="empty">none</span>';

      const recent = d.recent || [];
      $("recent").innerHTML = recent.length ? recent.map(r => `
        <tr><td>${fmt(r.at)}</td><td>${esc(r.platform || "—")}</td>
          <td class="mono">${esc(r.workflowId ?? "—")} / ${esc(r.taskId ?? "—")}</td>
          <td class="mono">${esc(r.capability)}</td>
          <td><span class="st st-${esc(r.status)}">${esc(r.status)}</span></td>
          <td>${esc(r.note ?? "")}</td></tr>`).join("")
        : '<tr><td colspan="6" class="empty">No steps yet.</td></tr>';

      $("foot").textContent = "Updated " + new Date().toLocaleTimeString();
    }

    async function tick() {
      try {
        const res = await fetch("api/status", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        render(await res.json());
      } catch (e) { $("sub").textContent = "Could not reach the executor: " + e.message; }
    }

    $("saveBtn").onclick = async () => {
      $("saveMsg").textContent = "Saving…";
      try {
        const res = await fetch("api/settings", {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({
            platform: $("inName").value.trim() || "oppex",
            baseUrl: $("inBaseUrl").value.trim(),
            clientId: $("inClientId").value.trim(),
            apiKey: $("inApiKey").value
          })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        $("inApiKey").value = "";
        $("saveMsg").textContent = "Saved. Connecting…";
        setTimeout(tick, 900);
      } catch (e) { $("saveMsg").textContent = "Save failed: " + e.message; }
    };

    tick();
    setInterval(tick, 5000);
  </script>
</body>
</html>
