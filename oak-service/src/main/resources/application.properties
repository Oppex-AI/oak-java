# ── OAK service ──────────────────────────────────────────────────────────────
# The customer-side executor. It registers with the orchestration platform, pulls
# steps, runs them via oak-tools, and reports results. It opens outbound
# connections only and listens on no port.

# ── Platform (the configured backend) ────────────────────────────────────────
# Which backend this is (for logs and the UI), and where it lives. Leave base-url
# empty to run the service without connecting — it stays idle and says so.
oak.platform.name=${OAK_PLATFORM_NAME:oppex}
oak.platform.base-url=${OAK_PLATFORM_BASE_URL:}

# Workspace API key for this tool service, sent as X-API-KEY. Its own key row, so
# revoking the executor does not affect anything else. Prefer an env var over a
# checked-in value.
oak.platform.api-key=${OAK_PLATFORM_API_KEY:}

# ── This service's identity at registration ──────────────────────────────────
# Keep the name stable across restarts: the platform keys the registration on it,
# so a name that changes every boot leaves dead registrations behind.
oak.service.name=${OAK_SERVICE_NAME:oak-service}
oak.service.version=0.1.0

# ── Poll loop ────────────────────────────────────────────────────────────────
oak.poll.interval=10s
# How many steps may run at once. Steps within one runbook are sequential upstream.
oak.poll.worker-threads=4

# ── Built-in tool sets to advertise. Turn a set off to advertise only your own. ─
oak.tools.aws-enabled=true
oak.tools.docker-enabled=true

# ── Logging ──────────────────────────────────────────────────────────────────
quarkus.log.category."ai.oak".level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n

# No HTTP server yet. The management UI (added next) will enable it.
quarkus.http.host-enabled=false
