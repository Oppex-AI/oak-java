# ── OAK service ──────────────────────────────────────────────────────────────
# The customer-side executor. It opens outbound connections to the orchestration
# platform and listens on no port. The register→poll→execute→report client and
# its configuration are added in a later step, on top of Tool.execute().

# INFO on our own packages is one line per step plus connection events, which is
# what you want in an incident. DEBUG adds per-message detail.
quarkus.log.category."ai.oak".level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n

# No HTTP server. Nothing here serves requests, and a port bound by accident is
# a port someone has to justify in a security review.
quarkus.http.host-enabled=false
