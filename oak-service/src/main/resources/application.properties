# ── Oppex ADK tools server ──────────────────────────────────────────────────
#
# This service opens outbound HTTPS connections to Oppex and nothing else. It
# listens on no port and needs no inbound firewall rule.

# Where Oppex is. Required.
oppex.adk.base-url=${OPPEX_BASE_URL:https://api.oppex.example}

# Credentials. Prefer the encrypted file over api-key: a key set through an
# environment variable shows up in process listings and diagnostic bundles.
# Write the file once with CredentialStore, then set OPPEX_ADK_PASSPHRASE.
#oppex.adk.credentials-file=/etc/oppex/agent.oppex-credentials
oppex.adk.api-key=${OPPEX_API_KEY:}

# Reported to Oppex, and how it keys this registration. Keep it stable across
# restarts: a name containing a random id makes every restart look like a new
# agent and leaves dead registrations behind.
oppex.adk.agent-name=${OPPEX_AGENT_NAME:oppex-adk-tools-server}

# AUTO tries the WebSocket and falls back to polling if an outbound proxy
# refuses the upgrade. WEBSOCKET fails instead of degrading, which is useful in
# a test and wrong in production. POLL skips the socket entirely.
oppex.adk.transport-mode=AUTO
oppex.adk.poll-interval=10s

# How many steps may run at once. Steps from different incidents can arrive
# together; steps within one runbook are sequential.
oppex.adk.worker-threads=4

# The built-in AWS capabilities (FIND_ASG). Turn off if you only want your own.
oppex.adk.aws-capabilities-enabled=true

# ── Logging ────────────────────────────────────────────────────────────────
# INFO on our own packages is one line per step plus connection events, which
# is what you want in an incident. DEBUG adds per-message detail.
quarkus.log.category."ai.oak".level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n

# No HTTP server. Nothing here serves requests, and a port bound by accident is
# a port someone has to justify in a security review.
quarkus.http.host-enabled=false
