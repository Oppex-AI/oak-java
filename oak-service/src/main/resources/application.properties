# === OAK service ==============================================================
# The customer-side executor. For each configured platform it pairs (client id +
# admin approval -> a dedicated token), registers, pulls steps, runs them via
# oak-tools, and reports results. It opens outbound connections only; the only
# listener is the management UI.

# --- Platforms (configured backends; the same handshake runs for each) --------
# One entry per backend under oak.platforms.<name>.*. Oppex is the first; add
# another under a different name later with no code change. Values are wired to
# env vars so nothing sensitive is baked in; the "oppex" slot is declared empty
# and filled from the environment or the management page.
oak.platforms.oppex.base-url=${OAK_PLATFORM_BASE_URL:}
# Workspace client id (oak_…) from the platform's OAK/Tools page, and the
# pre-shared pairing secret issued alongside it. Together they turn on
# approval-based pairing: the service proves itself with the secret and an admin
# approves. Prefer setting these from the management page over env/config.
oak.platforms.oppex.client-id=${OAK_PLATFORM_CLIENT_ID:}
oak.platforms.oppex.pairing-secret=${OAK_PLATFORM_PAIRING_SECRET:}

# Where encrypted connection state (pairing secret, token) is persisted. Default
# ~/.oak. Set OAK_SECRET_PASSPHRASE to encrypt with a passphrase you control.
oak.data-dir=${OAK_DATA_DIR:}

# --- This service's identity at registration ---------------------------------
# Keep the name stable across restarts: the platform keys the registration on it.
oak.service.name=${OAK_SERVICE_NAME:oak-service}
oak.service.version=0.1.0

# --- Poll loop ---------------------------------------------------------------
oak.poll.interval=10s
# How many steps may run at once, across all platforms.
oak.poll.worker-threads=4

# --- Built-in tool sets to advertise. Turn a set off to advertise only your own.
oak.tools.aws-enabled=true
oak.tools.docker-enabled=true

# --- Management UI -----------------------------------------------------------
# The only listener: the status page and its /api endpoints. On a shared host,
# bind to localhost with OAK_UI_HOST=127.0.0.1.
quarkus.http.port=${OAK_UI_PORT:9020}
quarkus.http.host=${OAK_UI_HOST:0.0.0.0}

# --- Logging -----------------------------------------------------------------
quarkus.log.category."ai.oak".level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n
